name: e2e

# Runs the action from this repo on a real runner with fixture responses, so no
# real token is needed. Grows with each milestone (thumbnails in M4, commit and
# push in M6).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Check ImageMagick can write WebP (section 17.4)
        run: |
          node --input-type=module -e "
            import { preflight } from './src/thumbs.js';
            const tool = await preflight();
            console.log(JSON.stringify(tool));
            if (tool.format !== 'webp') { console.log('::error::WebP encoder missing on this runner'); process.exit(1); }
          "
      - name: Run action (dry run, fixtures)
        id: feed
        uses: ./
        with:
          provider: instagram
          token: fixture-token-not-real
          dry_run: 'true'
          config: examples/simple-media.yml
          fixture_dir: test/fixtures/instagram
      - name: Check outputs
        run: test "${{ steps.feed.outputs.changed }}" = "false"
