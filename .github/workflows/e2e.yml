name: e2e

# Runs the action from this repo on a real runner with fixture responses, so no
# real token is needed. The commit and push go to a scratch branch that is
# deleted at the end, so main never receives fixture data.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Check ImageMagick can write WebP (section 17.4)
        run: |
          node --input-type=module -e "
            import { preflight } from './src/thumbs.js';
            const tool = await preflight();
            console.log(JSON.stringify(tool));
            if (tool.format !== 'webp') { console.log('::error::WebP encoder missing on this runner'); process.exit(1); }
          "
      - name: Run action (dry run, fixtures)
        id: feed
        uses: ./
        with:
          provider: instagram
          token: fixture-token-not-real
          dry_run: 'true'
          config: examples/simple-media.yml
          fixture_dir: test/fixtures/instagram
      - name: Check outputs
        run: test "${{ steps.feed.outputs.changed }}" = "false"
      - name: Switch to a scratch branch
        run: git switch -c "e2e-scratch-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Run action (real commit and push, fixtures)
        id: push
        uses: ./
        with:
          provider: instagram
          token: fixture-token-not-real
          config: examples/simple-media.yml
          fixture_dir: test/fixtures/instagram
      - name: Check the push reached the remote
        run: |
          test "${{ steps.push.outputs.changed }}" = "true"
          branch="$(git branch --show-current)"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git log -1 --format='%s | %an' | grep -E '^feed: \+[0-9]+ new, -0 removed \(instagram\) \| github-actions\[bot\]$'
          test -f feed/index.html && test -f feed/index.json
      - name: Run action again (no new data, no commit)
        id: again
        uses: ./
        with:
          provider: instagram
          token: fixture-token-not-real
          config: examples/simple-media.yml
          fixture_dir: test/fixtures/instagram
      - name: Check the second run changed nothing
        run: test "${{ steps.again.outputs.changed }}" = "false"
      - name: Delete the scratch branch
        if: always()
        run: git push origin --delete "e2e-scratch-${{ github.run_id }}-${{ github.run_attempt }}" || true
