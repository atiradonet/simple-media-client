name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: npm ci
      - run: npm run lint
      - name: Test with coverage
        run: npm run coverage
      - name: Check dist is up to date
        run: |
          npm run build
          git diff --exit-code dist || { echo "::error::dist/ is stale. Run npm run build and commit."; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
